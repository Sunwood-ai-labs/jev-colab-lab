[project]
name = "jev-colab-kev-experiment"
version = "0.1.0"
description = "Reproducible Colab/T4 inference experiment for Jared Palmer's kev-0.5b"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15,<2",
    "huggingface-hub>=0.30,<1",
    "numpy>=2.5,<3",
    "peft>=0.15,<1",
    "pydantic>=2.7,<3",
    "pygame>=2.6,<3",
    "torch>=2.6,<2.9",
    "torchao>=0.16,<1",
    "transformers>=4.51,<4.58",
]

[dependency-groups]
dev = [
    "nbformat>=5.10,<6",
    "pytest>=8,<10",
]
