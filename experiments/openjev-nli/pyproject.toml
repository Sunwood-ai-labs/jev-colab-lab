[project]
name = "jev-openjev-nli"
version = "0.1.0"
description = "Reproducible L4 inference measurement for the original AlexWortega/openjev 4B NLI checkpoint"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=1.5,<2",
  "safetensors>=0.5,<1",
  "transformers==5.15.0",
]

[project.optional-dependencies]
colab = [
  "accelerate>=1.7,<2",
]

[tool.uv]
package = false
